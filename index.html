<!DOCTYPE html>
<html lang="km">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CHA Telegram ChatBot</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Khmer+OS+Koulen&family=Noto+Sans+Khmer:wght@400;600;700&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Poppins', 'Noto Sans Khmer', sans-serif;
      background: #f0f4f8;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow-x: hidden;
    }

    /* ── Header ── */
    .header {
      text-align: center;
      padding: 24px 20px 8px;
    }

    .header .khmer-title, .header .khmer-red {
      font-family: 'Khmer OS Koulen', sans-serif;
      font-size: 1.05rem;
      font-weight: 700;
      line-height: 1.6;
    }

    .header .khmer-title {
      color: #1a3c7a;
    }

    .header .khmer-red {
      color: #d32f2f;
    }

    .header .welcome {
      font-size: 1.45rem;
      font-weight: 700;
      color: #1a3c7a;
      margin-top: 8px;
    }

    .header .welcome .cha {
      color: #d32f2f;
    }

    /* ── Phone Image ── */
.phone-image {
      margin: -60px auto 8px;
      max-width: 360px;
      width: 100%;
    }

    .phone-image img {
      width: 100%;
      height: auto;
      display: block;
      object-fit: contain;
    }

    /* ── CTA Buttons ── */
    .cta-buttons {
      display: flex;
      gap: 16px;
      margin: -100px 0 16px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .cta-btn {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 12px 24px;
      border-radius: 30px;
      font-size: 0.9rem;
      font-weight: 600;
      color: #fff;
      text-decoration: none;
      transition: transform 0.2s, box-shadow 0.2s;
      box-shadow: 0 4px 16px rgba(0,0,0,0.15);
    }

    .cta-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(0,0,0,0.22);
    }

    .cta-btn svg { width: 20px; height: 20px; fill: #fff; }

    .cta-btn.messenger { background: #0084ff; }
    .cta-btn.telegram { background: #229ed9; }

    /* ── Footer ── */
    .footer {
      text-align: center;
      padding: 16px 20px 24px;
    }

    .footer-logo-img {
      width: 330px;
      max-width: 100%;
      height: auto;
      display: block;
      margin: -24px auto 0;
    }

    /* ── Responsive ── */
    @media (max-width: 400px) {
      .header .welcome { font-size: 1.2rem; }
      .phone-image { max-width: 100%; padding: 0 16px; }
      .cta-buttons { gap: 12px; }
      .cta-btn { padding: 10px 18px; font-size: 0.82rem; }
      .footer-logo-img { width: 100%; max-width: 280px; }
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header class="header">
    <div class="khmer-title">រីករាយស្វាគមន៍ មកកាន់ប្រព័ន្ធឆ្លើយតបសារស្វ័យប្រវត្តិ</div>
    <div class="khmer-red">របស់សមាគមជំងឺហេម៉ូហ្វីលាកម្ពុជា</div>
    <div class="welcome">Welcome to <span class="cha">CHA</span> Telegram ChatBot</div>
  </header>

  <!-- Phone Image -->
  <div class="phone-image">
    <img src="aseet cha.png" alt="CHA ChatBot Phone Mockup">
  </div>

  <!-- CTA Buttons -->
  <div class="cta-buttons">
    <a href="https://t.me/Chacambodia_bot" target="_blank" class="cta-btn telegram">
      <svg viewBox="0 0 24 24"><path d="M11.944 0A12 12 0 0 0 0 12a12 12 0 0 0 12 12 12 12 0 0 0 12-12A12 12 0 0 0 12 0a12 12 0 0 0-.056 0zm4.962 7.224c.1-.002.321.023.465.14a.506.506 0 0 1 .171.325c.016.093.036.306.02.472-.18 1.898-.962 6.502-1.36 8.627-.168.9-.499 1.201-.82 1.23-.696.065-1.225-.46-1.9-.902-1.056-.693-1.653-1.124-2.678-1.8-1.185-.78-.417-1.21.258-1.91.177-.184 3.247-2.977 3.307-3.23.007-.032.014-.15-.056-.212s-.174-.041-.249-.024c-.106.024-1.793 1.14-5.061 3.345-.48.33-.913.49-1.302.48-.428-.008-1.252-.241-1.865-.44-.752-.245-1.349-.374-1.297-.789.027-.216.325-.437.893-.663 3.498-1.524 5.83-2.529 6.998-3.014 3.332-1.386 4.025-1.627 4.476-1.635z"/></svg>
      Telegram
    </a>
  </div>

  <!-- Footer -->
  <footer class="footer">
    <img src="cha-logo-left.png" alt="CHA Logo" class="footer-logo-img">
  </footer>

</body>
</html>
